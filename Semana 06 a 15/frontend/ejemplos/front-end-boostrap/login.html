<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Librería API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100">

    <div class="card border-secondary-subtle shadow-lg" style="width: 100%; max-width: 380px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h4 class="fw-bold mb-1">Librería API</h4>
                <p class="text-secondary small">Inicia sesión para gestionar el catálogo</p>
            </div>

            <div id="login-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <form id="form-login">
                <div class="mb-3">
                    <label class="form-label small text-secondary">Usuario</label>
                    <input type="text" id="username" class="form-control" value="juanperez" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-secondary">Contraseña</label>
                    <input type="password" id="password" class="form-control" value="supersegura123" required>
                </div>
                <button type="submit" id="btn-login" class="btn btn-primary w-100 fw-semibold">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
    <script>
        $("#form-login").on("submit", iniciarLogin);
    </script>
</body>
</html>
