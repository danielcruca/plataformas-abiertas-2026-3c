<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes — Librería API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-body-tertiary">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body border-bottom border-secondary-subtle mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="libros.html">Librería API</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="libros.html">Libros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="reportes.html">Reportes</a>
                    </li>
                </ul>
                <button class="btn btn-outline-secondary btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="mb-0">Reportes y Diagnóstico</h3>
                <p class="text-secondary small mb-0">Visualización gráfica de métricas de ventas e inventario</p>
            </div>
            <div>
                <span id="status-badge" class="badge bg-secondary me-2">Verificando...</span>
                <button class="btn btn-outline-light btn-sm" onclick="cargarReportes()">Actualizar Gráficos</button>
            </div>
        </div>

        <div class="row g-4">
            <!-- Top 3 Ventas (Grafico de Barras) -->
            <div class="col-md-6">
                <div class="card border-secondary-subtle h-100">
                    <div class="card-header fw-semibold">Top 3 Ventas (`reportesVentas/top3`)</div>
                    <div class="card-body d-flex align-items-center justify-content-center" style="height: 300px;" id="chart-top3-container">
                        <canvas id="canvasTop3"></canvas>
                    </div>
                </div>
            </div>

            <!-- Libros en Stock Grafico de Dona-->
            <div class="col-md-6">
                <div class="card border-secondary-subtle h-100">
                    <div class="card-header fw-semibold">Libros en Stock (`reportesVentas/libros-stock`)</div>
                    <div class="card-body d-flex align-items-center justify-content-center" style="height: 300px;" id="chart-stock-container">
                        <canvas id="canvasStock"></canvas>
                    </div>
                </div>
            </div>

   
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        verificarSesion();
        $(document).ready(() => cargarReportes());
    </script>
</body>
</html>
