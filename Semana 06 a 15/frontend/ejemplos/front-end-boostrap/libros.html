<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros — Librería API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body border-bottom border-secondary-subtle mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="libros.html">Librería API</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" href="libros.html">Libros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reportes.html">Reportes</a>
                    </li>
                </ul>
                <button class="btn btn-outline-secondary btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="mb-0">Gestión de Libros</h3>
                <p class="text-secondary small mb-0">Administra el inventario conectado a MongoDB</p>
            </div>
            <button class="btn btn-primary" onclick="abrirModalCrear()">+ Nuevo Libro</button>
        </div>

        <!-- Barra de búsqueda por ID -->
        <div class="card border-secondary-subtle mb-4">
            <div class="card-body py-3">
                <div class="row g-2 align-items-center">
                    <div class="col-md-8">
                        <input type="text" id="buscar-id" class="form-control form-control-sm" placeholder="Buscar por ID exacto (ej. 6824d6e3da1b9434df3d6461)...">
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-secondary btn-sm w-100" onclick="cargarLibros($('#buscar-id').val())">Buscar</button>
                        <button class="btn btn-outline-secondary btn-sm w-100" onclick="$('#buscar-id').val(''); cargarLibros();">Ver Todos</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card border-secondary-subtle shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="tabla-libros">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="text-center py-4 text-secondary">Cargando catálogo...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Crear / Editar -->
    <div class="modal fade" id="modalLibro" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-secondary-subtle">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-titulo">Nuevo Libro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-libro">
                    <div class="modal-body">
                        <input type="hidden" id="libro-id">
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Título del libro</label>
                            <input type="text" id="titulo" class="form-control" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Nombre del Autor</label>
                                <input type="text" id="autor-nombre" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Apellido del Autor</label>
                                <input type="text" id="autor-apellido" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-secondary">Nacionalidad del Autor</label>
                            <input type="text" id="autor-nacionalidad" class="form-control">
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Precio ($)</label>
                                <input type="number" step="0.01" id="precio" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-secondary">Cantidad en Stock</label>
                                <input type="number" id="stock" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        verificarSesion();
        $(document).ready(() => cargarLibros());
        $("#form-libro").on("submit", guardarLibro);

        function abrirModalCrear() {
            $("#modal-titulo").text("Nuevo Libro");
            $("#form-libro")[0].reset();
            $("#libro-id").val("");
            new bootstrap.Modal(document.getElementById("modalLibro")).show();
        }

        function abrirModalEditar(libro) {
            $("#modal-titulo").text("Editar Libro");
            $("#libro-id").val(libro._id?.$oid || libro._id || libro.id);
            $("#titulo").val(libro.titulo);
            $("#autor-nombre").val(libro.autor?.nombre || "");
            $("#autor-apellido").val(libro.autor?.apellido || "");
            $("#autor-nacionalidad").val(libro.autor?.nacionalidad || "");
            $("#precio").val(libro.precio);
            $("#stock").val(libro.cantidad_stock);
            new bootstrap.Modal(document.getElementById("modalLibro")).show();
        }
    </script>
</body>
</html>
